site_description: Página personal de Francisco Puga
site_url: https://franciscopuga.es
site_author: Francisco Puga
copyright: Copyright &copy; 2007-2024 Francisco Puga. Bajo licencia CC-BY 4.0.

theme:
    name: material
    language: es
    custom_dir: overrides
    # favicon: favicon.ico
    palette:
        scheme: conocimientoabierto
    features:
        - navigation.indexes
        - navigation.tabs
        # - navigation.tabs.sticky
        - navigation.sections
        # - navigation.top
        # - navigation.instant
        # - navigation.instant.progress
        # - navigation.tracking
        # - header.autohide
        - toc.follow
        - content.code.copy
        # - content.tabs.link
        # navigation.footer
        # navigation.indexes
        # - search.highlight
        # - search.share
        # - search.suggest

extra_css:
    - extra/extra.css
# extra_javascript:
#     - extra/extra.js

exclude_docs: |
    drafts/            # A "drafts" directory anywhere.

# strict: true

validation:
    omitted_files: warn
    absolute_links: warn
    unrecognized_links: warn

