    #   - privacy:
    #       enabled: !ENV [CI, false]
    #   - social:
    #       cards: !ENV [CARDS, false]
    - rss:
          # enabled: !ENV [CARDS, false]
          pretty_print: true
          match_path: "blog/posts/.*"
          abstract_chars_count: -1
          feed_ttl: 2880
          json_feed_enabled: false
          date_from_meta:
              # as_creation: date.created
              # as_update: date.updated
              as_creation: date
              datetime_format: "%Y-%m-%dT%H:%M:%S"
              # as_update: git
          feeds_filenames:
              rss_created: rss.xml
              rss_updated: rss-updated.xml
      #   categories:
      #     - categories
      #     - tags

extra:
    generator: false
    social:
        - icon: fontawesome/brands/github
          name: fpuga on GitHub
          link: https://github.com/fpuga
        - icon: fontawesome/brands/x-twitter
          name: fpuga on X
          link: https://x.com/fpuga
        - icon: fontawesome/brands/stack-overflow
          name: fpuga on StackOverflow
          link: https://stackoverflow.com/users/930271/francisco-puga
        - icon: fontawesome/brands/linkedin
          link: hhttps://www.linkedin.com/in/francisco-puga-b25a8361/
    analytics:
        provider: umami
        enabled: !ENV [ANALYTICS, false]

markdown_extensions:
    - attr_list
    # - def_list
    - abbr
    - md_in_html
    - admonition
    - pymdownx.details
    - pymdownx.highlight:
          anchor_linenums: true
          line_spans: __span
          pygments_lang_class: true
    - pymdownx.inlinehilite
    - pymdownx.tabbed:
          alternate_style: true
    - pymdownx.emoji:
          emoji_index: !!python/name:material.extensions.emoji.twemoji
          emoji_generator: !!python/name:material.extensions.emoji.to_svg
              #   - pymdownx.magiclink:
              #       repo_url_shorthand: true
